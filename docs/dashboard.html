<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — WatchEarn Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070d;color:#ddddf0;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.loader{position:fixed;inset:0;background:#07070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
.loader-title{font-size:1.5rem;font-weight:800;color:#7c6eff}
.spinner{width:36px;height:36px;border:3px solid #1c1c2e;border-top-color:#7c6eff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="loader-title">WatchEarn Pro</div>
  <div class="spinner"></div>
  <p style="color:#7070a0;font-size:0.85rem">Loading dashboard...</p>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL      = 'https://srnygmsnrofumbvvqajg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybnlnbXNucm9mdW1idnZxYWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NDkzNTIsImV4cCI6MjA5MzIyNTM1Mn0.UfFyLXs-twDZOMHEtYoOzbLqEDFXiIZrb10Xg68K0X8';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
});

const init = async () => {
  await new Promise(r => setTimeout(r, 1000));

  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    window.location.href = '/watchearn-pro/index.html';
    return;
  }

  // Check username set hai ya nahi
  const { data: profile } = await supabase
    .from('profiles')
    .select('username, role')
    .eq('id', session.user.id)
    .single();

  if (!profile || !profile.username) {
    // Pehli baar — setup pe bhejo
    window.location.href = '/watchearn-pro/setup.html';
    return;
  }

  // Username hai — full dashboard load karo
  document.getElementById('loader').innerHTML = `
    <div style="text-align:center;padding:40px">
      <div style="font-size:2rem;margin-bottom:12px">👋 Welcome back!</div>
      <div style="color:#7c6eff;font-size:1.2rem;font-weight:700;margin-bottom:8px">@${profile.username}</div>
      <div style="color:#7070a0;font-size:0.9rem;margin-bottom:24px">Full dashboard coming soon...</div>
      <button onclick="logout()" style="padding:12px 28px;background:#7c6eff;color:white;border:none;border-radius:10px;font-size:1rem;cursor:pointer">Logout</button>
    </div>
  `;
};

window.logout = async () => {
  await supabase.auth.signOut();
  window.location.href = '/watchearn-pro/index.html';
};

init();
</script>
</body>
</html>
